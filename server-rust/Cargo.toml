[package]
name = "server-rust"
version = "1.0.0"
edition = "2021"
authors = ["Carlos <carlos@zentrack.app>"]
description = "ZenTrack High-Performance Native Input Server for Linux and Windows"

[[bin]]
name = "zentrack-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
rust-embed = "8.4"
mime_guess = "2.0"
qrcode = { version = "0.14", features = ["svg"] }
rand = "0.8"
local-ip-address = "0.6"
byteorder = "1.5"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_System_Console",
] }
vigem-client = "0.1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
