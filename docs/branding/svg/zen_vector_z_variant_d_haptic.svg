<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="tokyo-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1f2335" />
      <stop offset="100%" stop-color="#16161e" />
    </radialGradient>

    <linearGradient id="haptic-z-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dcfff" />
      <stop offset="50%" stop-color="#7aa2f7" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>

    <filter id="haptic-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tokyo-bg)" />
  <rect x="12" y="12" width="488" height="488" rx="106" fill="none" stroke="rgba(122, 162, 247, 0.12)" stroke-width="2" />

  <!-- Ondas Hápticas Concéntricas en el Vértice del Toque -->
  <g opacity="0.6">
    <circle cx="180" cy="335" r="90" fill="none" stroke="#bb9af7" stroke-width="2" stroke-dasharray="4,6" opacity="0.3" />
    <circle cx="180" cy="335" r="60" fill="none" stroke="#7aa2f7" stroke-width="2.5" opacity="0.5" />
    <circle cx="180" cy="335" r="35" fill="none" stroke="#7dcfff" stroke-width="3" opacity="0.75" />
  </g>

  <!-- Vector Z Principal Fluido -->
  <path d="M 165 185 
           L 330 185 
           C 358 185, 368 205, 345 228
           L 205 328
           C 185 348, 195 362, 222 362
           L 350 362" 
        fill="none" 
        stroke="url(#haptic-z-grad)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#haptic-glow)" />

  <!-- Núcleo de Resplandor Central -->
  <path d="M 172 185 
           L 326 185 
           C 344 185, 350 198, 336 214
           L 214 322
           C 200 336, 206 362, 224 362
           L 344 362" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.85" />

  <!-- Punto de Impacto Háptico (El dedo tocando el pad) -->
  <circle cx="180" cy="335" r="14" fill="#7dcfff" filter="url(#haptic-glow)" />
  <circle cx="180" cy="335" r="6" fill="#ffffff" />
</svg>