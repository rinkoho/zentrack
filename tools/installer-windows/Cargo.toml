[package]
name = "zentrack-installer"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "ZenTrack-Setup"
path = "src/main.rs"

[dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
