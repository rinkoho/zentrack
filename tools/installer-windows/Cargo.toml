[package]
name = "zentrack-installer"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "ZenTrack-Setup"
path = "src/main.rs"

[[bin]]
name = "Uninstall"
path = "src/uninstall_bin.rs"

[dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "windows")'.dependencies]
vigem-client = "0.1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
